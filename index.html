<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Shop - Донат в игры</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent-purple: #7c3aed;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-color: #2d3748;
            --success: #48bb78;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 50%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
        }

        /* Header */
        .header {
            background: rgba(15, 15, 26, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Game Cards Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .game-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-purple);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.3);
        }

        /* Стили для картинки аватарки */
        .game-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            margin: 0 auto 10px;
            display: block;
            background: #2d3748; /* Цвет заглушки, если картинка не прогрузится */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Если картинки нет, показываем эмодзи */
        .game-icon-fallback {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            background: linear-gradient(135deg, #2d3748, #1a202c);
        }

        .game-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-price {
            color: var(--accent-green);
            font-size: 12px;
            font-weight: 500;
        }

        /* Modal Styles (сокращено для краткости, оставь свои стили модалок) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            border: 1px solid var(--border-color);
        }
        .input-group { margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 15px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        .total-display {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        .btn {
            width: 100%; padding: 15px;
            border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600;
            cursor: pointer; margin-bottom: 10px;
        }
        .btn-primary { background: var(--gradient-1); color: white; }
        .btn-secondary { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color); }
        
        .currency-list { display: grid; gap: 10px; }
        .currency-item {
            background: var(--bg-card); padding: 15px;
            border-radius: 12px; cursor: pointer;
            display: flex; justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="header">
        <h1>🎮 Game Shop</h1>
        <p style="color: var(--text-secondary); font-size: 14px;">Быстрый донат в любимые игры</p>
    </div>

    <div class="container">
        <div class="games-grid" id="gamesGrid"></div>
    </div>

    <!-- Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div id="orderForm">
                <div style="text-align: center; margin-bottom: 20px;">
                    <h2 id="modalTitle" style="margin-bottom: 10px;">Игра</h2>
                    <span id="modalPrice" style="background: var(--gradient-1); padding: 5px 15px; border-radius: 20px; font-size: 14px;">0₽</span>
                </div>
                <div class="input-group">
                    <label style="display:block; margin-bottom:8px; color:#aaa;">Количество:</label>
                    <input type="number" id="amount" placeholder="Введите количество" min="1">
                </div>
                <div class="total-display">
                    <span style="color:#aaa;">Итого:</span>
                    <span id="totalAmount" style="font-weight:bold; font-size:18px;">0₽</span>
                </div>
                <button class="btn btn-primary" onclick="submitOrder()">✅ Оформить заказ</button>
                <button class="btn btn-secondary" onclick="closeModal()">❌ Отмена</button>
            </div>
            <div id="successMessage" style="display:none; text-align:center;">
                <div style="font-size:50px; margin-bottom:10px;">✅</div>
                <h3>Заказ создан!</h3>
                <p style="color:#aaa; margin: 10px 0;">Администратор скоро свяжется с вами</p>
                <button class="btn btn-primary" onclick="closeModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Steam Modal -->
    <div class="modal" id="steamModal">
        <div class="modal-content">
            <h2 style="text-align:center; margin-bottom:20px;">🎮 Steam Валюты</h2>
            <div class="currency-list" id="currencyList"></div>
            <button class="btn btn-secondary" onclick="closeSteamModal()" style="margin-top:20px;">◀️ Назад</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Данные игр. Обрати внимание на поле 'img'
        const games = {
            brawl_gems: { 
                name: "Brawl Stars", 
                subtitle: "Гемы",
                icon: "💎",
                img: "img/brawl_gems.png", // Путь к картинке
                price: 1.2
            },
            standoff_gold: { 
                name: "Standoff 2", 
                subtitle: "Голда",
                icon: "",
                img: "img/standoff_gold.png",
                price: 0.05
            },
            steam: { 
                name: "Steam", 
                subtitle: "Пополнение",
                icon: "🎮",
                img: "img/steam.png",
                price: null
            },
            robux: { 
                name: "Roblox", 
                subtitle: "Робуксы",
                icon: "🟥",
                img: "img/robux.png",
                price: 0.9
            },
            uc_pubg: { 
                name: "PUBG Mobile", 
                subtitle: "UC",
                icon: "🔫",
                img: "img/uc_pubg.png",
                price: 1.1
            },
            cp_cod: { 
                name: "CoD Mobile", 
                subtitle: "CP",
                icon: "🎯",
                img: "img/cp_cod.png",
                price: 1.3
            }
        };

        const steamCurrencies = {
            steam_rub: { name: "🇷 Рубли RUB", price: 1.0 },
            steam_usd: { name: "💵 Доллары USD", price: 92.0 },
            steam_eur: { name: "💶 Евро EUR", price: 100.0 },
            steam_uah: { name: "🇺 Гривны UAH", price: 2.3 },
            steam_kzt: { name: "🇰 Тенге KZT", price: 0.18 },
            steam_gbp: { name: "💷 Фунты GBP", price: 117.0 },
            steam_cny: { name: " Юани CNY", price: 12.7 }
        };

        let selectedGame = null;
        let selectedCurrency = null;

        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            Object.entries(games).forEach(([key, game]) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => selectGame(key);

                const priceText = game.price ? `${game.price}₽` : 'Выбрать';
                
                // Логика: пытаемся загрузить картинку. Если ошибка - показываем эмодзи.
                const imgHtml = `
                    <img src="${game.img}" alt="${game.name}" class="game-img" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="game-icon-fallback" style="display:none;">${game.icon}</div>
                `;

                card.innerHTML = `
                    ${imgHtml}
                    <div class="game-name">${game.name}</div>
                    <div class="game-price">${game.subtitle} • ${priceText}</div>
                `;
                grid.appendChild(card);
            });
        }

        function selectGame(key) {
            selectedGame = key;
            const game = games[key];
            if (key === 'steam') { showSteamModal(); return; }

            document.getElementById('modalTitle').textContent = `${game.name}`;
            document.getElementById('modalPrice').textContent = `${game.price}₽ за ед.`;
            document.getElementById('amount').value = '';
            document.getElementById('totalAmount').textContent = '0₽';
            
            document.getElementById('orderModal').classList.add('active');
            document.getElementById('orderForm').style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSteamModal() {
            const list = document.getElementById('currencyList');
            list.innerHTML = '';
            Object.entries(steamCurrencies).forEach(([key, currency]) => {
                const item = document.createElement('div');
                item.className = 'currency-item';
                item.onclick = () => selectCurrency(key, currency);
                item.innerHTML = `<span>${currency.name}</span><span style="color:var(--accent-green)">${currency.price}₽</span>`;
                list.appendChild(item);
            });
            document.getElementById('steamModal').classList.add('active');
        }

        function selectCurrency(key, currency) {
            selectedCurrency = key;
            document.getElementById('modalTitle').textContent = currency.name;
            document.getElementById('modalPrice').textContent = `${currency.price}₽ за ед.`;
            document.getElementById('amount').value = '';
            document.getElementById('totalAmount').textContent = '0₽';
            closeSteamModal();
            document.getElementById('orderModal').classList.add('active');
            document.getElementById('orderForm').style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        document.getElementById('amount').addEventListener('input', function() {
            const amount = parseFloat(this.value) || 0;
            let price = selectedCurrency ? steamCurrencies[selectedCurrency].price : games[selectedGame].price;
            document.getElementById('totalAmount').textContent = (amount * price).toFixed(2) + '₽';
        });

        function submitOrder() {
            const amount = parseFloat(document.getElementById('amount').value);
            if (!amount || amount <= 0) { tg.showAlert('Введите количество!'); return; }

            let itemKey, itemName, price;
            if (selectedCurrency) {
                itemKey = selectedCurrency; itemName = steamCurrencies[selectedCurrency].name; price = steamCurrencies[selectedCurrency].price;
            } else {
                itemKey = selectedGame; itemName = games[selectedGame].name; price = games[selectedGame].price;
            }

            const orderData = {
                action: 'new_order',
                item_key: itemKey,
                item_name: itemName,
                amount: amount,
                total: parseFloat((amount * price).toFixed(2))
            };

            tg.sendData(JSON.stringify(orderData));
            
            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
        }

        function closeModal() { document.getElementById('orderModal').classList.remove('active'); }
        function closeSteamModal() { document.getElementById('steamModal').classList.remove('active'); }

        renderGames();
    </script>
</body>
</html>
